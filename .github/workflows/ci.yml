name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Configure CMake
      env:
        CC: ${{ matrix.os == 'ubuntu-latest' && 'gcc-13' || '' }}
        CXX: ${{ matrix.os == 'ubuntu-latest' && 'g++-13' || '' }}
      run: cmake --preset release
    
    - name: Build
      run: cmake --build --preset release --parallel
    
    - name: Run Unit Tests
      run: ctest --preset release --output-on-failure --verbose
    
    - name: Run Backtest (Integration Test - Unix)
      if: runner.os == 'Linux' || runner.os == 'macOS'
      timeout-minutes: 1
      run: ./build/release/src/backtest

    - name: Run Backtest (Integration Test - Windows)
      if: runner.os == 'Windows'
      timeout-minutes: 1
      run: .\build\release\src\Release\backtest.exe
